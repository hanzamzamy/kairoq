name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}
    # Linux is supported; macOS and Windows are built and tested on a best-effort basis.
    continue-on-error: ${{ matrix.os != 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python packages
        run: python -m pip install nanobind scikit-build-core numpy shapely pytest
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DKAIROQ_PYTHON=ON
          -DPython_EXECUTABLE="${{ env.pythonLocation }}/${{ runner.os == 'Windows' && 'python.exe' || 'bin/python' }}"
      - name: Build
        run: cmake --build build --config Release -j 4
      - name: C++ tests
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Python package
        run: python -m pip install .
      - name: Python tests
        run: python -m pytest
      - name: Validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-${{ matrix.os }}
          path: build/validation/
