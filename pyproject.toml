[build-system]
requires = ["scikit-build-core>=0.10", "nanobind>=2.4"]
build-backend = "scikit_build_core.build"

[project]
name = "kairoq"
version = "0.1.0"
description = "Electrical, thermal, electromagnetic and signal-integrity analysis of printed circuit boards from fabrication data"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "THIRD_PARTY.md"]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]
classifiers = [
    "Programming Language :: C++",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]

[project.urls]
Repository = "https://github.com/hanzamzamy/kairoq"
Documentation = "https://github.com/hanzamzamy/kairoq/tree/main/docs"
Issues = "https://github.com/hanzamzamy/kairoq/issues"

[project.optional-dependencies]
test = ["pytest>=7", "shapely>=2"]

[tool.scikit-build]
minimum-version = "build-system.requires"
build-dir = "build/{wheel_tag}"
cmake.build-type = "Release"
wheel.packages = ["src/python/kairoq"]

[tool.scikit-build.cmake.define]
KAIROQ_PYTHON = "ON"
KAIROQ_TESTS = "OFF"
KAIROQ_CLI = "ON"
