# Power-on of the cm5_minima carrier: the converter, its inductor and the load switches
# dissipate from t = 0 (component power from a table), the 5 V supply path carries 3 A
# (electrothermal coupling), and the bottom face rests on an enclosure plate through a
# 1 mm thermal pad.
board: ../testdata/kicad/cm5_minima/gerber
dc:
  ports:
    - {name: VIN, component: J101, net: +5V, voltage_v: 5.0}
    - {name: LOAD, component: Module301, net: +5V, current_a: -3.0}
    - {name: GND_IN, component: J101, net: GND, voltage_v: 0.0}
    - {name: GND_RET, component: Module302, net: GND, current_a: 3.0}
thermal:
  ambient_c: 25
  top: {convection_w_m2k: 8, emissivity: 0.9}
  bottom: {convection_w_m2k: 8, emissivity: 0.9}
  component_power:
    file: cm5_minima_power.csv
    junction_column: Rjc (K/W)
  heatsinks:
    - name: PLATE
      face: bottom
      area: [{rect_mm: [80, -80, 140, -50]}]
      tim: {thickness_mm: 1.0, k: 3.0}
      resistance_k_per_w: 6.0
      heat_capacity_j_per_k: 90
  transient:
    duration_s: 600
    step_s: 1
    max_step_s: 30
